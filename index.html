<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tubig · Check your water service</title>
<meta name="description" content="See what your Philippine water provider must give you, check your bill, and file a complaint that cites the rule.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4E89'/%3E%3Cpath d='M16 6s-7 8.4-7 12.6a7 7 0 0 0 14 0C23 14.4 16 6 16 6z' fill='%23fff'/%3E%3C/svg%3E">
<script>(function () { try { var t = localStorage.getItem('tubig-theme'); if (t === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {} })();</script>
</head>
<body>
<a class="skip-link" href="#panel">Skip to content</a>

<!-- MAP APP -->
<div class="app" id="app">
  <div id="map" class="map" aria-label="Map" role="application"></div>

  <header class="topbar">
    <a class="logo" href="#/" aria-label="Tubig home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M16 6s-7 8.4-7 12.6a7 7 0 0 0 14 0C23 14.4 16 6 16 6z"/></svg>
      <span>Tubig</span>
    </a>
    <button class="menu-btn" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="menu" id="menu" hidden aria-label="Main">
      <a href="#/">Check your water</a>
      <a href="#/districts">Water districts</a>
      <a href="#/about">About and data</a>
      <button type="button" id="theme-btn">Dark mode</button>
    </nav>
  </header>

  <section class="panel" id="panel" aria-label="Tubig" tabindex="-1">
    <button class="grabber" id="grabber" type="button" aria-label="Expand panel"><span></span></button>
    <div class="panel-scroll" id="panel-scroll">
      <div id="view" class="view"></div>
    </div>
    <div class="panel-foot" id="panel-foot"></div>
  </section>

  <div class="map-ctrls">
    <button class="map-btn" id="locate-fab" type="button" aria-label="Use my location" title="Use my location">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
    </button>
  </div>
</div>

<!-- PAGES (districts, about) -->
<div class="pages" id="pages" hidden>
  <header class="page-bar">
    <a class="logo dark" href="#/" aria-label="Tubig home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M16 6s-7 8.4-7 12.6a7 7 0 0 0 14 0C23 14.4 16 6 16 6z"/></svg>
      <span>Tubig</span>
    </a>
    <nav aria-label="Pages">
      <a href="#/">Check your water</a>
      <a href="#/districts" data-page="districts">Water districts</a>
      <a href="#/about" data-page="about">About and data</a>
    </nav>
  </header>
  <main id="page" class="page"></main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="print-letter" id="print-letter" aria-hidden="true"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
